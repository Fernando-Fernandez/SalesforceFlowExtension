<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Flow diagram</title>
    <link rel="stylesheet" href="./popup.css" />
</head>
<body>
    <div id="main">
        <div id="leftPanel">
            <div id="defaultExplainer">
            </div>

            <div id="lintResults"></div>

            <div id="flowExplainer" >
                <div id="gptInputs" >
                    <div id="gptDialogContainer" style="display: none;">
                        <label for="gptQuestion">Ask your question or leave blank for default prompt:</label>
                        <input id="gptQuestion" type="text" />
                        <button id="gptButton">Ask GPT</button>
                    </div>
                </div>
                <span id="error" style="font-weight: bold; color: red;" ></span>
                <br />
                <div id="spinner" class="lds-dual-ring">&#x263C;</div>
                <span id="response" > </span>
            </div>
        </div>

        <div id="rightPanel">
            <div id="gpt" >
                <div id="providerSelection" class="model-selection-inline">
                    <span class="model-selection-label">AI Provider:</span>
                    <div class="model-options-inline">
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="openai" checked>
                            <span class="model-name-compact">OpenAI</span>
                        </label>
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="anthropic">
                            <span class="model-name-compact">Anthropic</span>
                        </label>
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="gemini">
                            <span class="model-name-compact">Gemini</span>
                        </label>
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="ollama">
                            <span class="model-name-compact">Ollama (local)</span>
                        </label>
                    </div>
                </div>

                <div id="apiKeyRow">
                    <label for="openAIKey" id="apiKeyLabel">OpenAI API Key</label>
                    <input id="openAIKey" type="password" name="openAIKey" />
                    &nbsp;&nbsp;
                    <button id="setKey" >Set key</button>
                </div>
                <div id="ollamaHint" style="display: none;">
                    Ollama runs locally at http://localhost:11434 — no API key needed.
                    If requests fail with 403, start Ollama with
                    OLLAMA_ORIGINS=chrome-extension://* and try again.
                </div>

                <div id="gptModelSelection" class="model-selection" style="display: none;">
                    <div class="model-selection-inline">
                        <span class="model-selection-label">AI Model:</span>
                        <select id="modelSelect"></select>
                        <input type="text" id="custom-model-name" style="display: none;"
                               placeholder="custom model name" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="flow" >
        <button id="downloadButton" style="display: none;">Download Flow Definition in MarkDown Format</button>
        <div id="flowTableContainer" style="display: none;"></div>
    </div>
    <script src="./scripts/flowParser.js"></script>
    <script src="./scripts/aiProviders.js"></script>
    <script src="./scripts/popup.js"></script>
</body>
</html>
