<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Flow diagram</title>
    <link rel="stylesheet" href="./popup.css" />
</head>
<body>
    <!-- TOP AREA: flow header + issues on the left, action buttons + the AI
         dialogs on the right; the table spans the full width below -->
    <div id="topGrid">
        <div id="leftColumn">
            <header id="appHeader">
                <div id="flowTitle">Salesforce Flow</div>
                <div id="flowMeta"></div>
                <div id="defaultExplainer"></div>
            </header>

            <div id="errorBar"><span id="error"></span></div>

            <!-- ISSUE SUMMARY: linter findings -->
            <section id="issueSummary">
                <div id="lintResults"></div>
            </section>
        </div>

        <aside id="rightColumn">
            <div id="headerActions">
                <button id="downloadButton" class="action-btn" style="display: none;">&#x2193; Markdown</button>
                <button id="downloadMermaidButton" class="action-btn" style="display: none;">&#x2193; Mermaid</button>
                <button id="aiSettingsToggle" class="action-btn">&#x2699; AI Settings</button>
            </div>

            <!-- AI SETTINGS dialog (popped out by the AI Settings button) -->
            <section id="aiSettingsPanel" class="panel" style="display: none;">
                <div class="panel-title">&#x2699; AI Settings</div>
                <div id="providerSelection" class="model-selection-inline">
                    <span class="model-selection-label">AI Provider:</span>
                    <div class="model-options-inline">
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="openai" checked>
                            <span class="model-name-compact">OpenAI</span>
                        </label>
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="anthropic">
                            <span class="model-name-compact">Anthropic</span>
                        </label>
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="gemini">
                            <span class="model-name-compact">Gemini</span>
                        </label>
                        <label class="model-option-compact">
                            <input type="radio" name="ai-provider" value="ollama">
                            <span class="model-name-compact">Ollama (local)</span>
                        </label>
                    </div>
                </div>

                <div id="apiKeyRow">
                    <label for="openAIKey" id="apiKeyLabel">OpenAI API Key</label>
                    <input id="openAIKey" type="password" name="openAIKey" />
                    <button id="setKey" class="action-btn">Set key</button>
                </div>
                <div id="ollamaHint" style="display: none;">
                    Ollama runs locally at http://localhost:11434 &mdash; no API key needed.
                    If requests fail with 403, start Ollama with
                    OLLAMA_ORIGINS=chrome-extension://* and try again.
                </div>

                <div id="gptModelSelection" class="model-selection">
                    <div class="model-selection-inline">
                        <span class="model-selection-label">AI Model:</span>
                        <select id="modelSelect"></select>
                        <input type="text" id="custom-model-name" style="display: none;"
                               placeholder="custom model name" />
                    </div>
                </div>
            </section>

            <!-- EXPLAIN / Ask-AI dialog (always visible) -->
            <section id="explainPanel" class="panel">
                <div class="panel-title">&#x2728; Explain</div>
                <div id="gptDialogContainer">
                    <label for="gptQuestion">Ask your question or leave blank for default prompt:</label>
                    <input id="gptQuestion" type="text" />
                    <button id="gptButton" class="action-btn action-btn-primary">Ask AI</button>
                </div>
                <div id="explainTasks">
                    <button id="findIssuesButton" class="task-btn">Find issues</button>
                    <button id="generateDocsButton" class="task-btn">Generate documentation</button>
                    <button id="suggestDescriptionsButton" class="task-btn">Suggest descriptions</button>
                </div>
                <div id="spinner" class="lds-dual-ring">&#x263C;</div>
                <span id="response"> </span>
            </section>
        </aside>
    </div>

    <!-- FLOW ELEMENTS: the itemized table, full width -->
    <section id="flow">
        <div id="flowTableContainer" style="display: none;"></div>
    </section>

    <script src="./scripts/flowParser.js"></script>
    <script src="./scripts/aiProviders.js"></script>
    <script src="./scripts/popup.js"></script>
</body>
</html>
